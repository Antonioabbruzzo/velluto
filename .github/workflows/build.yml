name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Il codice resta privato: gli APK vengono pubblicati in un repository pubblico separato,
      # così Downloader e l'aggiornamento automatico possono scaricarli senza login.
      RELEASES_REPO: ${{ github.repository_owner }}/velluto-releases
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compila APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          UPDATE_REPO: ${{ env.RELEASES_REPO }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk velluto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: velluto-apk
          path: velluto.apk

      - name: Pubblica la release
        if: env.HAS_RELEASES_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" velluto.apk \
            --repo "$RELEASES_REPO" \
            --title "Velluto 1.0.${{ github.run_number }}" \
            --notes "Nuova versione di Velluto" \
            --latest
