name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

env:
  # Il codice resta privato: gli installer vengono pubblicati in un repository pubblico separato,
  # così Downloader e l'aggiornamento automatico possono scaricarli senza login.
  RELEASES_REPO: ${{ github.repository_owner }}/velluto-releases
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    name: APK Fire TV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepara la chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compila APK
        env:
          UPDATE_REPO: ${{ env.RELEASES_REPO }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk velluto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: velluto-apk
          path: velluto.apk

  windows:
    name: Installer Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compila MSI
        env:
          UPDATE_REPO: ${{ env.RELEASES_REPO }}
        run: gradle :desktop:packageMsi --no-daemon --stacktrace

      - name: Rinomina MSI
        shell: bash
        run: cp desktop/build/compose/binaries/main/msi/*.msi Velluto.msi

      - uses: actions/upload-artifact@v4
        with:
          name: velluto-msi
          path: Velluto.msi

  release:
    name: Pubblica
    needs: [android, windows]
    # Si pubblica solo dal ramo principale: gli altri rami servono per provare le modifiche.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Pubblica la release
        if: env.HAS_RELEASES_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "build-$BUILD_NUMBER" out/velluto.apk out/Velluto.msi \
            --repo "$RELEASES_REPO" \
            --title "Velluto 1.0.$BUILD_NUMBER" \
            --notes "velluto.apk = Fire TV · Velluto.msi = Windows (richiede VLC 64-bit)" \
            --latest
